[project]
name = "webscraper-rag-pipeline"
version = "0.2.0"
description = "Recursive web scraper feeding a RAG chatbot (Groq LLM + local embeddings + ChromaDB)"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Web services
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.9",
    # Frontend
    "streamlit>=1.38,<2.0",
    "requests>=2.32,<3.0",
    # Config
    "python-dotenv>=1.0,<2.0",
    # Vector store
    "chromadb>=1.0,<2.0",
    "numpy>=1.26",
    # Embeddings
    "sentence-transformers>=3.0,<6.0",
    "transformers>=4.44",
    "torch>=2.2",
    "einops>=0.8",
    # LLM
    "groq>=0.11,<1.0",
    # Scraping
    "crawl4ai>=0.7.4",
    "playwright>=1.45",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "lxml-html-clean>=0.4",
    "tldextract>=5.1",
    "python-slugify>=8.0",
    # Chunking
    "tiktoken>=0.7",
    # Output
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
