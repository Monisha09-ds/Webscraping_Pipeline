x-common: &common
  build: .
  env_file:
    - .env
  volumes:
    - .:/app                      # code + sitecontent/chroma_store/sessions on the host
    - hf-cache:/app/.cache/huggingface   # embedding model, survives rebuilds
  restart: unless-stopped

services:
  # --- Backends ---
  scraper-api:
    <<: *common
    container_name: scraper-api
    command: python src/api/scraper_endpoints.py
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  chat-api:
    <<: *common
    container_name: chat-api
    command: python src/api/chat_api.py
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Frontend (single entrypoint, both pages) ---
  ui:
    <<: *common
    container_name: site-intelligence-ui
    command: >
      streamlit run src/frontend/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      SCRAPER_API_URL: http://scraper-api:5005
      CHAT_API_URL: http://chat-api:5003
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      scraper-api:
        condition: service_healthy
      chat-api:
        condition: service_healthy

volumes:
  hf-cache:
